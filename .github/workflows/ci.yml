name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Typechecks the backend too: the studio-local-api plugin lives in
      # apps/editor-web/vite.config.ts, which `vite build` never compiles.
      # Without this step, undefined identifiers in the API handlers ship
      # green and only fail at runtime.
      - name: Typecheck
        run: npm run typecheck

      - name: Build app
        run: npm run build

      - name: Validate export fixtures
        run: npm run test:exports

      - name: Run interop tests
        run: npm run test:interop

      - name: Dockerfile smoke build
        run: docker build -t prune-ci-smoke .
