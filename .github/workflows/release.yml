name: Release

# Publishes a release when a v* tag is pushed:
#   git tag -a v1.0.0 -m "Prune 1.0.0" && git push origin v1.0.0
#
# Requires two repository secrets for the image push:
#   DOCKERHUB_USERNAME  - Docker Hub account name
#   DOCKERHUB_TOKEN     - Docker Hub access token (not the account password)
# If those are absent the image job is skipped and the GitHub Release is
# still created, so tagging never hard-fails on a fork or an unconfigured repo.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

env:
  IMAGE_NAME: fauxrhino/prune

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Never publish a release that would not pass CI.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Export fixtures
        run: npm run test:exports

      - name: Interop suite
        run: npm run test:interop

      # The tag must agree with package.json, or the About dialog, the
      # Homebrew formula and the image tag drift apart again.
      - name: Verify tag matches package.json version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PKG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG"
            exit 1
          fi

  image:
    name: Publish image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Secrets are passed via env rather than interpolated into the script
      # body, so they are never expanded into a logged command line.
      - name: Check registry credentials
        id: creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not set - skipping image publish."
          fi

      # QEMU enables the linux/arm64 build. Without it the image is amd64
      # only, which forces Apple Silicon users into emulation - unusable
      # for ffmpeg and Whisper workloads.
      - name: Set up QEMU
        if: steps.creds.outputs.available == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.creds.outputs.available == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.creds.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        if: steps.creds.outputs.available == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        if: steps.creds.outputs.available == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
